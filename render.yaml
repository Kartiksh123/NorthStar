services:
  - type: web
    name: northstar-api
    runtime: node
    region: oregon
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: northstar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CONNECTION_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: northstar-db
    databaseName: northstar
    user: northstar
    region: oregon
